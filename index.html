<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hidden Chapters — a little universe of stories, poems, pictures and thoughts.">
  <title>Hidden Chapters</title>
  <style>
    :root {
      --sage: #dce6d7;
      --sage-dark: #647b62;
      --sage-deep: #354c39;
      --ivory: #f8f6ee;
      --paper: #fffdf7;
      --text: #39463a;
      --muted: #738071;
      --border: #e2e6dc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--text);
      font-family: Georgia, "Noto Serif Bengali", serif;
      line-height: 1.8;
    }

    header {
      background: var(--sage);
      text-align: center;
      padding: 58px 18px 45px;
    }

    .eyebrow {
      letter-spacing: 3px;
      font-size: 11px;
      color: var(--sage-dark);
    }

    header h1 {
      color: var(--sage-deep);
      font-size: clamp(38px, 7vw, 64px);
      margin: 8px 0;
      letter-spacing: 1px;
    }

    header p {
      max-width: 550px;
      margin: 0 auto;
      color: #586b56;
      font-style: italic;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px 12px;
      background: var(--paper);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav button {
      border: 0;
      border-radius: 24px;
      padding: 9px 14px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    nav button:hover, nav button.active {
      background: var(--sage);
      color: var(--sage-deep);
    }

    main {
      max-width: 960px;
      min-height: 48vh;
      margin: 0 auto;
      padding: 42px 20px 70px;
    }

    .welcome, .entry, .empty-card {
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      margin: 18px 0;
    }

    h2 {
      color: var(--sage-deep);
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.5;
      margin-top: 0;
    }

    h3 { color: var(--sage-dark); margin-bottom: 6px; }
    .subtitle { color: var(--muted); }

    .home-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 14px;
      margin-top: 25px;
    }

    .home-link {
      display: block;
      text-align: left;
      background: var(--paper);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 17px;
      cursor: pointer;
      font: inherit;
    }

    .home-link:hover { background: var(--sage); }
    .home-link strong { display: block; color: var(--sage-deep); }
    .home-link span { font-size: 13px; color: var(--muted); }

    footer {
      text-align: center;
      padding: 26px 15px;
      background: var(--sage);
      color: var(--sage-deep);
      font-size: 13px;
    }

    .note { font-size: 14px; color: var(--muted); }

    @media (max-width: 600px) {
      header { padding: 40px 15px 32px; }
      nav { position: static; gap: 4px; }
      nav button { padding: 8px 10px; font-size: 13px; }
      main { padding: 28px 14px 45px; }
      .welcome, .entry, .empty-card { padding: 19px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">A WORLD OF WORDS & FEELINGS</div>
    <h1>Hidden Chapters</h1>
    <p>A little universe where words whisper, dreams bloom, and every heart has a story.</p>
  </header>

  <nav id="menu" aria-label="Main menu"></nav>
  <main id="content" aria-live="polite"></main>

  <footer>
    <div>Hidden Chapters</div>
    <div>Read a little. Feel a little. Discover a hidden chapter.</div>
  </footer>

  <script>
    const sections = [
      { id: "home", name: "Home", title: "Welcome to My Little World",
        intro: "Some stories are written in words, while others live quietly in our hearts. This is a place for stories, poems, beautiful thoughts, and inspiration.",
        description: "Explore the chapters below and discover a little world of words and feelings." },
      { id: "gallery", name: "Gallery", title: "Gallery",
        intro: "A collection of beautiful moments, pictures, nature, skies and flowers.",
        description: "তোমার পছন্দের ছবি এখানে যোগ করতে পারবে।" },
      { id: "videos", name: "Videos", title: "Videos",
        intro: "Little moments, creative videos and stories told through moving pictures.",
        description: "তোমার ভিডিওর লিংক বা অনুমতিপ্রাপ্ত ভিডিও এখানে যোগ করতে পারবে।" },
      { id: "literature", name: "সাহিত্যের সৌন্দর্য", title: "সাহিত্যের সৌন্দর্য",
        intro: "শব্দের মাঝে লুকিয়ে থাকে অনুভূতি, কল্পনা আর জীবনের নানা গল্প।",
        description: "এখানে তোমার বাংলা গল্প, ছোটগল্প, প্রবন্ধ ও অন্যান্য লেখা প্রকাশিত হবে।" },
      { id: "english", name: "English Writings", title: "English Writings",
        intro: "Stories, reflections and creative thoughts written in English.",
        description: "Add your original English stories and writings here." },
      { id: "poetry", name: "কবিতার মর্মার্থ", title: "কবিতার মর্মার্থ",
        intro: "কবিতার প্রতিটি শব্দে থাকে একেকটি অনুভূতি, একেকটি না-বলা কথা।",
        description: "এখানে তোমার নিজের বাংলা কবিতা ও তার ভাবনা তুলে ধরবে।" },
      { id: "english-poems", name: "English Poems", title: "English Poems",
        intro: "A quiet corner for poems about dreams, nature, life and feelings.",
        description: "Share your original English poems here." },
      { id: "speeches", name: "Their Speeches", title: "Their Speeches",
        intro: "Words and speeches that inspire reflection and meaningful conversations.",
        description: "এখানে বক্তৃতা বা বক্তব্যের সারাংশ এবং বক্তার নাম যোগ করতে পারবে।" },
      { id: "quotes", name: "সেই উক্তিগুলো", title: "সেই উক্তিগুলো",
        intro: "কিছু কথা অল্প শব্দেই গভীর অর্থ প্রকাশ করে।",
        description: "এখানে বাংলা ও ইংরেজি উক্তি রাখতে পারবে। অন্যের উক্তি দিলে যথাসম্ভব লেখকের নাম উল্লেখ করবে।" },
      { id: "about", name: "আমার ব্যক্তিত্ব", title: "আমার ব্যক্তিত্ব",
        intro: "Welcome to my little corner of the internet.",
        description: "আমি শব্দ, গল্প ও কবিতার মাধ্যমে আমার ভাবনা প্রকাশ করতে ভালোবাসি। এই জায়গাটি আমার সৃজনশীলতার ছোট্ট জগৎ।" }
    ];

    const menu = document.getElementById("menu");
    const content = document.getElementById("content");

    function openSection(id) {
      const section = sections.find(item => item.id === id) || sections[0];

      menu.querySelectorAll("button").forEach(button => {
        const selected = button.dataset.id === section.id;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-current", selected ? "page" : "false");
      });

      if (section.id === "home") {
        content.innerHTML = `
          <section class="welcome">
            <div class="eyebrow">WELCOME, READER</div>
            <h2>${section.title}</h2>
            <p>${section.intro}</p>
            <p>${section.description}</p>
            <p class="subtitle"><em>Read a little. Feel a little. Discover a hidden chapter.</em></p>
          </section>
          <h2>Explore the Chapters</h2>
          <div class="home-grid">
            ${sections.filter(item => item.id !== "home").map(item => `
              <button class="home-link" data-open="${item.id}">
                <strong>${item.name}</strong>
                <span>${item.title}</span>
              </button>
            `).join("")}
          </div>`;
      } else {
        content.innerHTML = `
          <section>
            <div class="eyebrow">HIDDEN CHAPTERS</div>
            <h2>${section.title}</h2>
            <p>${section.intro}</p>
            <div class="empty-card">
              <p>${section.description}</p>
              <p class="note">এই বিভাগে নতুন লেখা যোগ করার জন্য পরে এই কোডে কনটেন্ট বসাতে হবে।</p>
            </div>
          </section>`;
      }

      content.querySelectorAll("[data-open]").forEach(button => {
        button.addEventListener("click", () => openSection(button.dataset.open));
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    sections.forEach(section => {
      const button = document.createElement("button");
      button.textContent = section.name;
      button.dataset.id = section.id;
      button.addEventListener("click", () => openSection(section.id));
      menu.appendChild(button);
    });

    openSection("home");
  </script>
</body>
</html>
